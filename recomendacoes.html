    <title>Central de Recomendações - Caminho da Felicidade</title>

    <style>
        .rec-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-end;
            margin-bottom: 32px;
            border-bottom: 2px solid var(--border);
            padding-bottom: 16px;
        }
        @media (max-width: 600px) {
            .rec-header { flex-direction: column; align-items: flex-start; gap: 16px; }
        }
        .rec-title {
            font-size: 2rem;
            color: var(--accent);
            font-weight: 600;
            margin: 0 0 8px 0;
            font-family: "Outfit", sans-serif;
        }
        .rec-desc {
            color: var(--text-muted);
            margin: 0;
            font-size: 1rem;
        }
        .rec-tabs {
            display: flex;
            gap: 4px;
            margin-bottom: 24px;
            border-bottom: 1px solid var(--border);
        }
        .rec-tab {
            background: none;
            border: none;
            color: var(--text-muted);
            font-size: 0.95rem;
            font-weight: 500;
            font-family: "Outfit", sans-serif;
            padding: 12px 18px;
            cursor: pointer;
            border-bottom: 2px solid transparent;
            margin-bottom: -1px;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            transition: color 0.15s, border-color 0.15s;
        }
        .rec-tab:hover { color: var(--text-main); }
        .rec-tab.active {
            color: var(--accent);
            border-bottom-color: var(--accent);
        }
        .rec-tab-count {
            background: var(--border);
            color: var(--text-muted);
            font-size: 0.72rem;
            padding: 2px 7px;
            border-radius: 9px;
            font-weight: 600;
        }
        .rec-tab.active .rec-tab-count {
            background: var(--accent);
            color: #fff;
        }
        /* Grupo de recomendações vindas de uma mesma playlist (admin) */
        .rec-group {
            margin-bottom: 16px;
            border: 1px solid var(--border);
            border-radius: 12px;
            background: var(--surface);
            overflow: hidden;
        }
        .rec-group[open] {
            background: var(--surface);
        }
        .rec-group-header {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 14px 18px;
            cursor: pointer;
            user-select: none;
            list-style: none;
            font-family: "Outfit", sans-serif;
            border-bottom: 1px solid transparent;
            transition: background 0.15s, border-color 0.15s;
        }
        .rec-group-header::-webkit-details-marker { display: none; }
        .rec-group[open] .rec-group-header {
            border-bottom-color: var(--border);
        }
        .rec-group-header:hover {
            background: rgba(184, 134, 11, 0.05);
        }
        .rec-group-icon {
            font-size: 1.1rem;
        }
        .rec-group-name {
            font-weight: 600;
            font-size: 1rem;
            color: var(--text-main);
            flex: 1;
            min-width: 0;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }
        .rec-group-count {
            font-size: 0.78rem;
            color: var(--text-muted);
            white-space: nowrap;
        }
        .rec-group-chevron {
            font-size: 0.9rem;
            color: var(--text-muted);
            transition: transform 0.2s;
        }
        .rec-group[open] .rec-group-chevron {
            transform: rotate(180deg);
        }
        .rec-group-body {
            padding: 14px 14px 4px;
        }
        .rec-group-body .rec-card {
            margin-bottom: 10px;
        }
        .rec-group-body .rec-card:last-child {
            margin-bottom: 6px;
        }
        .rec-group-loose .rec-group-header {
            opacity: 0.85;
        }

        .rec-card {
            display: flex;
            gap: 16px;
            padding: 18px 20px;
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 10px;
            margin-bottom: 12px;
            align-items: flex-start;
            transition: transform 0.15s, box-shadow 0.15s;
        }
        .rec-card:hover {
            transform: translateY(-1px);
            box-shadow: 0 4px 14px rgba(0,0,0,0.06);
        }
        .rec-card.archived {
            background: transparent;
            border-style: dashed;
            opacity: 0.75;
        }
        .rec-card-body { flex: 1; min-width: 0; }
        .rec-card-title {
            font-size: 1.05rem;
            font-weight: 500;
            color: var(--text-main);
            font-family: 'Crimson Pro', serif;
            line-height: 1.4;
            margin: 0 0 6px 0;
        }
        .rec-card-title a {
            color: inherit;
            text-decoration: none;
        }
        .rec-card-title a:hover {
            color: var(--accent);
        }
        .rec-card-meta {
            font-size: 0.78rem;
            color: var(--text-muted);
            font-family: "Outfit", sans-serif;
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            align-items: center;
        }
        .rec-card-meta .dot { opacity: 0.4; }
        .rec-card-note {
            margin-top: 10px;
            padding: 8px 12px;
            background: var(--bg-color);
            border-left: 3px solid var(--accent);
            border-radius: 4px;
            font-size: 0.88rem;
            color: var(--text-muted);
            font-style: italic;
            line-height: 1.5;
        }
        .rec-card.archived .rec-card-note {
            border-left-color: var(--border);
        }
        .rec-card-actions {
            display: flex;
            flex-direction: column;
            gap: 6px;
            flex-shrink: 0;
        }
        .rec-action-btn {
            background: none;
            border: 1px solid var(--border);
            color: var(--text-muted);
            padding: 6px 12px;
            border-radius: 5px;
            cursor: pointer;
            font-size: 0.78rem;
            font-family: "Outfit", sans-serif;
            display: inline-flex;
            align-items: center;
            gap: 6px;
            white-space: nowrap;
            transition: background 0.15s, color 0.15s, border-color 0.15s;
        }
        .rec-action-btn:hover {
            color: var(--text-main);
            border-color: var(--accent);
        }
        .rec-action-btn[disabled] { opacity: 0.5; cursor: default; }
        .rec-action-btn.primary {
            background: var(--accent);
            border-color: var(--accent);
            color: #fff;
        }
        .rec-action-btn.primary:hover {
            opacity: 0.9;
        }
        .rec-empty {
            text-align: center;
            padding: 60px 20px;
            color: var(--text-muted);
            font-family: "Outfit", sans-serif;
        }
        .rec-empty svg {
            opacity: 0.4;
            margin-bottom: 16px;
        }
        .rec-empty-title {
            font-size: 1.1rem;
            margin-bottom: 8px;
            color: var(--text-main);
        }
        .rec-empty-desc { font-size: 0.9rem; }
        .rec-tag {
            display: inline-block;
            font-size: 0.68rem;
            font-weight: 600;
            padding: 1px 6px;
            border-radius: 3px;
            background: rgba(150,150,150,0.18);
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
    </style>
