    <style>
        .notebook-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-end;
            margin-bottom: 28px;
            border-bottom: 2px solid var(--border);
            padding-bottom: 16px;
        }

        @media (max-width: 600px) {
            .notebook-header { flex-direction: column; align-items: flex-start; gap: 16px; }
        }

        .notebook-title {
            font-size: 2rem;
            color: var(--accent);
            font-weight: 600;
            margin: 0 0 8px 0;
            font-family: "Outfit", sans-serif;
        }

        .notebook-desc { color: var(--text-muted); margin: 0; font-size: 1rem; }

        .notebook-btn {
            background: none;
            border: 1px solid var(--border);
            color: var(--accent);
            cursor: pointer;
            font-size: 0.72rem;
            font-weight: 500;
            padding: 3px 9px;
            border-radius: 5px;
            transition: background 0.15s, border-color 0.15s;
            text-decoration: none;
            font-family: "Outfit", sans-serif;
            white-space: nowrap;
        }
        .notebook-btn:hover { background: rgba(184, 134, 11, 0.1); border-color: var(--accent); }
        .notebook-btn.delete { color: #ff3b30; }
        .notebook-btn.delete:hover { background: rgba(255, 59, 48, 0.1); border-color: #ff3b30; }

        .notebook-empty {
            text-align: center;
            padding: 56px 20px;
            color: var(--text-muted);
            font-size: 1.05rem;
            line-height: 1.8;
        }

        /* ---- layout de duas colunas ---- */
        .salvos-layout { display: flex; gap: 28px; align-items: flex-start; }
        .salvos-rail {
            flex: 0 0 220px;
            min-width: 0;
            display: flex;
            flex-direction: column;
            gap: 3px;
            position: sticky;
            top: 84px;
        }
        .salvos-main { flex: 1; min-width: 0; }

        .folder-item {
            display: flex;
            align-items: center;
            gap: 9px;
            width: 100%;
            padding: 9px 11px;
            border-radius: 8px;
            border: 1px solid transparent;
            background: none;
            cursor: pointer;
            text-align: left;
            color: var(--text-main);
            font-family: "Outfit", sans-serif;
            font-size: 0.92rem;
            transition: background 0.12s, border-color 0.12s;
        }
        .folder-item:hover { background: rgba(184, 134, 11, 0.08); }
        .folder-item.active { background: rgba(184, 134, 11, 0.14); border-color: var(--accent); color: var(--accent); font-weight: 600; }
        .folder-item.drop-hover { border-color: var(--accent); border-style: dashed; background: rgba(184, 134, 11, 0.2); }
        .folder-name { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
        .folder-count { font-size: 0.75rem; color: var(--text-muted); font-family: "Outfit", sans-serif; }
        .folder-item.active .folder-count { color: var(--accent); }
        .folder-dot { width: 10px; height: 10px; border-radius: 50%; flex-shrink: 0; box-sizing: border-box; }

        .folder-add {
            margin-top: 8px;
            padding: 9px 11px;
            border-radius: 8px;
            border: 1px dashed var(--border);
            background: none;
            cursor: pointer;
            color: var(--text-muted);
            font-family: "Outfit", sans-serif;
            font-size: 0.86rem;
            text-align: left;
            transition: border-color 0.12s, color 0.12s;
        }
        .folder-add:hover { border-color: var(--accent); color: var(--accent); }

        .salvos-list-header {
            display: flex;
            align-items: center;
            gap: 12px;
            flex-wrap: wrap;
            margin-bottom: 10px;
            padding-bottom: 8px;
            border-bottom: 1px solid var(--border);
            min-height: 30px;
        }
        #salvos-current { font-weight: 600; color: var(--accent); font-size: 1.15rem; font-family: "Outfit", sans-serif; flex: 1 1 auto; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
        #salvos-tools { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; margin-left: auto; }
        .color-swatches { display: inline-flex; gap: 4px; align-items: center; }
        .color-swatch { width: 18px; height: 18px; border-radius: 50%; border: 2px solid transparent; cursor: pointer; padding: 0; }
        .color-swatch.active { border-color: var(--text-main); }

        /* Card em bloco: o título ocupa a largura inteira; as ações descem
           para uma barra inferior (não competem mais com o título). */
        .fav-card {
            display: block;
            padding: 14px 4px;
            border-bottom: 1px solid var(--border);
        }
        .fav-card:last-child { border-bottom: none; }
        .fav-card.dragging { opacity: 0.45; }
        .fav-card[draggable="true"] { cursor: grab; }
        .fav-main { display: block; text-decoration: none; color: inherit; }
        .fav-title {
            font-family: 'Crimson Pro', serif;
            font-size: 1.08rem;
            color: var(--text-main);
            line-height: 1.4;
        }
        .fav-main:hover .fav-title { color: var(--accent); }
        .fav-vol { font-size: 0.8rem; color: var(--text-muted); }
        .fav-topic-badge {
            display: inline-block;
            font-size: 0.68rem;
            background: var(--accent);
            color: #fff;
            padding: 1px 7px;
            border-radius: 10px;
            margin-left: 6px;
            vertical-align: middle;
            font-family: "Outfit", sans-serif;
            white-space: nowrap;
        }
        .fav-snippet {
            font-size: 0.85rem;
            color: var(--text-muted);
            margin-top: 4px;
            line-height: 1.5;
            overflow: hidden;
            text-overflow: ellipsis;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
        }
        .fav-footer {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
            flex-wrap: wrap;
            margin-top: 9px;
        }
        .fav-meta { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; min-width: 0; }
        .fav-folder-tag { display: inline-flex; align-items: center; gap: 5px; font-size: 0.72rem; color: var(--text-muted); font-family: "Outfit", sans-serif; max-width: 100%; min-width: 0; }
        .fav-folder-tag-name { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; max-width: 200px; }
        .fav-date { font-size: 0.72rem; color: var(--text-muted); font-family: "Outfit", sans-serif; white-space: nowrap; }
        .fav-actions { display: flex; flex-direction: row; gap: 6px; flex-shrink: 0; }

        /* ---- menu "Mover para" (reusa .search-modal) ---- */
        .move-list { display: flex; flex-direction: column; gap: 2px; padding: 4px 0 6px; max-height: 60vh; overflow-y: auto; }
        .move-opt {
            display: flex;
            align-items: center;
            gap: 10px;
            width: 100%;
            padding: 11px 12px;
            border: none;
            background: none;
            cursor: pointer;
            text-align: left;
            color: var(--text-main);
            font-family: "Outfit", sans-serif;
            font-size: 0.95rem;
            border-radius: 8px;
        }
        .move-opt:hover { background: rgba(184, 134, 11, 0.1); }
        .move-opt.active { color: var(--accent); font-weight: 600; }
        .move-opt .folder-name { flex: 1; }
        .move-check { color: var(--accent); }
        .move-new { color: var(--text-muted); }

        @media (max-width: 720px) {
            .salvos-layout { flex-direction: column; gap: 16px; }
            .salvos-rail {
                flex: none;
                width: 100%;
                position: static;
                flex-direction: row;
                flex-wrap: nowrap;
                gap: 6px;
                overflow-x: auto;
                padding-bottom: 8px;
                -webkit-overflow-scrolling: touch;
            }
            .folder-item { width: auto; flex: 0 0 auto; }
            .folder-item .folder-name { max-width: 140px; }
            .folder-add { margin-top: 0; flex: 0 0 auto; white-space: nowrap; }
            /* Barra inferior: pasta/data à esquerda, ações à direita; se faltar
               espaço, as ações caem para a linha de baixo alinhadas à direita. */
            .fav-actions { margin-left: auto; }
        }
    </style>
