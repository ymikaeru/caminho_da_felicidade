    <script>
        document.addEventListener('DOMContentLoaded', () => {
            buildSearchModal(); buildHistoryModal(); buildFavoritesModal();
            if (typeof revealPage === 'function') revealPage();
        });

        // Analytics: aguarda sessão Supabase real antes de chamar logAccess
        // (logAccess retorna silenciosamente se a sessão ainda não foi populada
        // pelo módulo login.js — checar só window.supabaseAuth.logAccess não basta).
        (function () {
            const POEM_VOL = 'poetry', POEM_FILE = 'yama-to-mizu';
            let _tries = 0;
            const _tryLog = async () => {
                _tries++;
                const supa = window.supabaseAuth?.supabase;
                if (supa) {
                    try {
                        const { data } = await supa.auth.getSession();
                        if (data?.session) {
                            window.supabaseAuth.logAccess(POEM_VOL, POEM_FILE, 'view')?.catch?.(() => { });
                            window._readTimeTracker?.start?.(POEM_VOL, POEM_FILE);
                            import('./js/scroll-progress.js?v=1').then(m => m.startScrollTracking?.(POEM_VOL, POEM_FILE)).catch(() => { });
                            return;
                        }
                    } catch (_) { }
                }
                if (_tries < 40) setTimeout(_tryLog, 300);
            };
            if (document.readyState === 'loading') {
                document.addEventListener('DOMContentLoaded', _tryLog);
            } else {
                _tryLog();
            }
        })();
    </script>
