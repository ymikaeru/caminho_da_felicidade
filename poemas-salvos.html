    <meta name="robots" content="noindex">
    <meta http-equiv="refresh" content="0; url=salvos.html">
    <!--
      "Poemas Salvos" foi unificado em "Salvos" (07/2026): o poema agora é um
      FAVORITO com pastas (mesmo sistema dos Ensinamentos), então tudo aparece
      junto em salvos.html. Esta página virou só um redirect pra não quebrar
      links/bookmarks antigos. Preserva ?lang=ja se presente.
    -->
    <script>
      (function () {
        try {
          var ja = /[?&]lang=ja\b/.test(location.search);
          location.replace('salvos.html' + (ja ? '?lang=ja' : ''));
        } catch (e) { location.href = 'salvos.html'; }
      })();
    </script>
</head>
