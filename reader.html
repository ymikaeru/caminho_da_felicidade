  <script>
    // Modo "embed=playlist" — usado pelo preview da playlist do admin
    // (js/playlists.js _mgrRenderReaderItem). Esconde a barra de ações
    // abaixo do título e mostra SÓ o tópico focado (?topic=N), pra dar
    // foco no artigo dentro do modal de gerenciamento.
    (function () {
      var params = new URLSearchParams(window.location.search);
      if (params.get('embed') !== 'playlist') return;
      document.documentElement.classList.add('embed-playlist');
      var focusIdx = parseInt(params.get('topic') || '0', 10);
      var s = document.createElement('style');
      s.textContent = ''
        // Esconde todo o "chrome" do reader pra dar foco só no artigo:
        // botões de ação, breadcrumb, nav footer (Anterior/Próximo) e o
        // botão flutuante "Continuar leitura".
        + '.embed-playlist .topic-save-bar,'
        + '.embed-playlist .breadcrumbs,'
        + '.embed-playlist .breadcrumb-trail,'
        + '.embed-playlist nav.breadcrumb,'
        + '.embed-playlist .reader-nav-footer,'
        + '.embed-playlist #resume-reading-btn,'
        + '.embed-playlist #reading-progress { display: none !important; }'
        // Mostra só o tópico focado da playlist.
        + '.embed-playlist .topic-content { display: none; }'
        + '.embed-playlist .topic-content.embed-focus { display: block !important; }'
        // Reader.main tem padding 60px 40px que cria um vazio no topo
        // do modal. Reduz pra começar o conteúdo logo no topo.
        + '.embed-playlist .reader-body .main { padding: 16px 32px !important; }'
        + '.embed-playlist .reader-body #readerContainer { padding: 0 !important; box-shadow: none !important; background: transparent !important; }';
      (document.head || document.documentElement).appendChild(s);
      var obs = new MutationObserver(function () {
        var topics = document.querySelectorAll('.topic-content');
        if (topics.length === 0) return;
        var foundFocus = false;
        topics.forEach(function (el) {
          var m = (el.id || '').match(/^topic-(\d+)$/);
          var idx = m ? parseInt(m[1], 10) : -1;
          if (idx === focusIdx) { el.classList.add('embed-focus'); foundFocus = true; }
        });
        if (!foundFocus && topics[0]) topics[0].classList.add('embed-focus');
        obs.disconnect();
      });
      obs.observe(document.documentElement, { childList: true, subtree: true });
    })();
  </script>

  <script>
    (function () {
      const bar = document.getElementById('reading-progress');
      const SHOW_AFTER = 300;   // px from top before bar can appear
      const HIDE_AFTER = 3000;  // ms of inactivity before auto-hiding

      let hideTimer = null;
      let aboveThreshold = false;

      function showUI() {
        if (aboveThreshold) {
          if (bar) bar.style.opacity = '1';
        }
      }

      window.addEventListener('scroll', function () {
        const scrollTop = window.scrollY || document.documentElement.scrollTop;
        const docHeight = document.documentElement.scrollHeight - document.documentElement.clientHeight;

        // Progress bar width
        if (bar && docHeight > 0) {
          bar.style.width = Math.min(100, (scrollTop / docHeight) * 100) + '%';
        }

        // Update threshold flag
        aboveThreshold = scrollTop > SHOW_AFTER;

        if (aboveThreshold) {
          showUI();
        } else {
          clearTimeout(hideTimer);
          if (bar) bar.style.opacity = '0';
        }
      }, { passive: true });

      // Also wake both on touch or mouse move
      ['touchstart', 'mousemove'].forEach(function (evt) {
        window.addEventListener(evt, showUI, { passive: true });
      });
    })();
  </script>
