    <style>
        .notebook-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-end;
            margin-bottom: 32px;
            border-bottom: 2px solid var(--border);
            padding-bottom: 16px;
        }

        @media (max-width: 600px) {
            .notebook-header {
                flex-direction: column;
                align-items: flex-start;
                gap: 16px;
            }
        }

        .notebook-title {
            font-size: 2rem;
            color: var(--accent);
            font-weight: 600;
            margin: 0 0 8px 0;
            font-family: "Outfit", sans-serif;
        }

        .notebook-desc {
            color: var(--text-muted);
            margin: 0;
            font-size: 1rem;
        }

        .notebook-group {
            margin-bottom: 40px;
        }

        .notebook-group-header {
            font-weight: 600;
            color: var(--accent);
            display: flex;
            align-items: baseline;
            justify-content: space-between;
            gap: 12px;
            font-size: 1.1rem;
            margin-bottom: 12px;
            padding-bottom: 8px;
            border-bottom: 1px solid var(--border);
        }

        .read-vol-count {
            font-size: 0.8rem;
            font-weight: 500;
            color: var(--text-muted);
            font-family: "Outfit", sans-serif;
            white-space: nowrap;
        }

        .read-section {
            font-size: 0.75rem;
            font-weight: 600;
            letter-spacing: 0.04em;
            text-transform: uppercase;
            color: var(--text-muted);
            font-family: "Outfit", sans-serif;
            margin: 18px 0 6px;
        }

        .read-item {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 9px 4px;
            border-bottom: 1px solid var(--border);
        }
        .read-item:last-child { border-bottom: none; }

        .read-item-check {
            width: 18px;
            height: 18px;
            color: var(--accent);
            flex-shrink: 0;
        }

        .read-item-title {
            flex: 1;
            min-width: 0;
            font-family: 'Crimson Pro', serif;
            font-size: 1.02rem;
            color: var(--text-main);
            text-decoration: none;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }
        .read-item-title:hover { color: var(--accent); }

        .read-item-meta {
            display: flex;
            align-items: center;
            gap: 8px;
            flex-shrink: 0;
        }

        .read-item-date {
            font-size: 0.72rem;
            color: var(--text-muted);
            font-family: "Outfit", sans-serif;
            white-space: nowrap;
        }

        .notebook-btn {
            background: none;
            border: 1px solid var(--border);
            color: var(--accent);
            cursor: pointer;
            font-size: 0.7rem;
            font-weight: 500;
            padding: 3px 8px;
            border-radius: 5px;
            transition: background 0.15s, border-color 0.15s;
            text-decoration: none;
            font-family: "Outfit", sans-serif;
            white-space: nowrap;
        }
        .notebook-btn:hover { background: rgba(184, 134, 11, 0.1); border-color: var(--accent); }
        .notebook-btn.delete { color: #ff3b30; }
        .notebook-btn.delete:hover { background: rgba(255, 59, 48, 0.1); border-color: #ff3b30; }

        .notebook-empty {
            text-align: center;
            padding: 60px 20px;
            color: var(--text-muted);
            font-size: 1.05rem;
            line-height: 1.8;
        }

        @media (max-width: 600px) {
            .read-item { flex-wrap: wrap; }
            .read-item-title { flex-basis: calc(100% - 28px); white-space: normal; }
            .read-item-meta { margin-left: 28px; }
        }
    </style>
